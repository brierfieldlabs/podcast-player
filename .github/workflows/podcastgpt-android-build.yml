name: Podcast Player Android APK build

on:
  pull_request:
    branches:
      - add/podcastgpt-customisations
      - fix/podcastgpt-startup-debug-overhead
      - feature/podcastgpt-tile-actions

permissions:
  contents: read

jobs:
  debugprod:
    name: Build debugProd APK (Hamblett CT142)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, podcastgpt-android]
    timeout-minutes: 90
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile changed features before full APK assembly
        run: |
          ./gradlew :modules:features:account:compileDebugProdKotlin \
            :modules:features:profile:compileDebugProdKotlin \
            :modules:features:settings:compileDebugProdKotlin \
            :modules:features:podcasts:compileDebugProdKotlin --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
      - name: Assemble debugProd APK
        run: |
          ./gradlew :app:assembleDebugProd --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
      - name: Verify Android package and version
        shell: bash
        run: |
          set -euo pipefail
          grep -Rq 'boolean DEBUG = false' app/build/generated/source/buildConfig/debugProd
          apk=$(find app/build/outputs/apk/debugProd -name '*.apk' -type f -print -quit)
          test -n "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          package=$("$aapt" dump badging "$apk" | grep "^package:")
          echo "$package"
          label=$("$aapt" dump badging "$apk" | grep "^application-label:")
          echo "$label"
          grep -Fx "application-label:'Podcast Player'" <<< "$label"
          grep -F "name='au.com.shiftyjelly.pocketcasts.debug'" <<< "$package"
          version=$(tr -d '\r\n' < podcast-player.version)
          grep -F "versionName='$version'" <<< "$package"
          version_code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$package")
          IFS=. read -r major minor patch <<< "$version"
          test "${version_code:-0}" -eq "$((major * 1000000 + minor * 1000 + patch))"
          "$apksigner" verify --print-certs "$apk" |
            grep -F "certificate SHA-256 digest: a7a8cc75251243fcabc1c5ae6c2eaa3c74ad9a464ae4a5679e56820cbd9eadc8"
          mkdir -p dist
          cp "$apk" "dist/Podcast-Player-v${version}.apk"
          sha256sum "dist/Podcast-Player-v${version}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Podcast-Player-APK
          path: dist/Podcast-Player-v*.apk
          if-no-files-found: error
          retention-days: 14
